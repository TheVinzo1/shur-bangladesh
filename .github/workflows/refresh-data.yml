name: Refresh NASA backup data

# Saves NASA POWER responses into data/ so the site keeps working if the API is unreachable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-data.mjs]
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-data.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh NASA POWER backup data"
          git push
